function navigate(view,opts={}){state.view=view;state.filters={};state.day=opts.day||'';state.review=opts.review||'';if(opts.anchor)state.anchor=opts.anchor;state.drawer='';state.decision='';setURL();render();window.scrollTo(0,0)}
function render(){const v=state.view;$('#breadcrumb').innerHTML='资金风控 / <b>'+({anchors:'主播冻结钻石',risks:'风险充值用户',reviews:'解封审核',daily:'主播冻结钻石 / 主播按日数据'}[v]||'主播冻结钻石')+'</b>';document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('active',n.dataset.nav===(v==='daily'?'anchors':v)));$('#screen').innerHTML=v==='risks'?renderRisks():v==='reviews'?renderReviews():v==='daily'?renderDaily():renderAnchors();if(state.day)showContribution(state.day);else if(state.review)showReview(state.review);else closeDrawer(false)}
function renderAnchors(){const f=state.filters,from=f.from||'2026-03-01',to=f.to||'2026-10-10';const rows=anchors.map(a=>({...a,filtered:a.days.filter(d=>dateIn(d.day,from,to))})).filter(a=>(!f.uid||a.id.includes(f.uid))&&(!f.country||a.country.includes(f.country))&&a.filtered.length).map(a=>({...a,freeze:a.filtered.reduce((s,d)=>s+d.freeze,0)})).filter(a=>a.freeze>0).sort((a,b)=>b.freeze-a.freeze);const total=rows.reduce((s,a)=>s+a.freeze,0);const eligible=reviews.filter(r=>r.status==='待审核'&&!r.hold).reduce((s,r)=>s+r.amount,0);return title('主播冻结钻石','按主播汇总当前仍冻结的收益，向下查看入账日与消费者贡献。',`<button class="btn" data-nav="reviews">查看解封审核 →</button>`)+`<div class="kpis">${kpi('当前冻结钻石',fmt(total),'按筛选条件汇总','emphasis')}${kpi('涉及主播',rows.length,'一位主播一条冻结数据')}${kpi('可解封待审核',fmt(eligible),'达标或到期，余额仍冻结','warning')}${kpi('待审申请',reviews.filter(r=>r.status==='待审核').length,'包含退款风控事项')}</div><div class="card"><div class="card-head"><h2>筛选冻结收益</h2><span>时间按主播收益成功入账日</span></div><div class="filters"><div class="field wide"><label>主播 UID</label><input id="anchor-uid" placeholder="输入主播 UID" value="${esc(f.uid||'')}"></div><div class="field"><label>入账开始日期</label><input id="anchor-from" type="date" value="${from}"></div><div class="field"><label>入账结束日期</label><input id="anchor-to" type="date" value="${to}"></div><div class="field wide"><label>主播国家</label><select id="anchor-country"><option value="">全部国家</option>${['尼泊尔','印度','中国台湾','美国'].map(c=>`<option ${f.country===c?'selected':''}>${c}</option>`).join('')}</select></div><button class="btn btn-primary" data-action="filter-anchors">查询</button><button class="btn" data-action="reset-anchors">重置</button></div></div><div class="card"><div class="card-head"><div class="section-title"><h2>主播冻结钻石列表</h2><span class="badge-count">${rows.length}</span></div><span>仅显示筛选范围内仍冻结的钻石</span></div><div class="table-wrap"><table class="table"><thead><tr><th>主播 UID / 昵称</th><th>主播国家</th><th>上级代理</th><th class="num">冻结钻石</th><th>最近入账</th><th class="action">操作</th></tr></thead><tbody>${rows.length?rows.map(a=>`<tr><td><div class="row-user"><span class="user-icon">${a.name.slice(0,1).toUpperCase()}</span><div><div class="name">${a.name}</div><div class="sub">UID ${a.id}</div></div></div></td><td>${a.country}</td><td>${a.guild}</td><td class="num">${fmt(a.freeze)}</td><td>${a.filtered.map(d=>d.day).sort().reverse()[0]}</td><td class="action"><button class="link-btn" data-action="open-daily" data-id="${a.id}">查看日数据 →</button></td></tr>`).join(''):`<tr><td colspan="6" class="empty">未找到符合条件的冻结收益</td></tr>`}</tbody></table></div>${pager(rows.length)}</div><div class="note">冻结收益仍计入主播收入统计，但不能提现或兑换。每笔收益只有一次“冻结 → 正常”转换；是否可解封与是否已解封是两个不同状态。</div>`}
function renderDaily(){const a=anchor(state.anchor),f=state.filters,from=f.from||'2026-03-01',to=f.to||'2026-10-10';const rows=a.days.filter(d=>dateIn(d.day,from,to)).sort((x,y)=>y.day.localeCompare(x.day));const freeze=rows.reduce((s,d)=>s+d.freeze,0),normal=rows.reduce((s,d)=>s+d.normal,0);return `<button class="back" data-action="back-anchors">← 返回主播冻结钻石</button>`+title('主播冻结按日数据',`主播 ${a.name} · UID ${a.id} · ${a.country}。按收益入账日查看总额、已确认与冻结分类。`)+`<div class="kpis">${kpi('范围内总钻石',fmt(freeze+normal),'收入统计金额')}${kpi('已确认钻石',fmt(normal),'包含直接正常入账及已解封收益')}${kpi('当前冻结钻石',fmt(freeze),'此部分不可提现或兑换','emphasis')}${kpi('日期数',rows.length,'按主播收益入账日')}</div><div class="card"><div class="filters"><div class="field"><label>入账开始日期</label><input id="daily-from" type="date" value="${from}"></div><div class="field"><label>入账结束日期</label><input id="daily-to" type="date" value="${to}"></div><button class="btn btn-primary" data-action="filter-daily">查询</button><button class="btn" data-action="reset-daily">重置</button></div></div><div class="card"><div class="card-head"><h2>主播 ${a.id} 的日收益</h2><span>总钻石 = 已确认钻石 + 当前冻结钻石</span></div><div class="table-wrap"><table class="table"><thead><tr><th>入账日期</th><th class="num">总钻石</th><th class="num">已确认钻石</th><th class="num">冻结钻石</th><th class="action">操作</th></tr></thead><tbody>${rows.length?rows.map(d=>`<tr><td class="name">${d.day}</td><td class="num">${fmt(d.normal+d.freeze)}</td><td class="num">${fmt(d.normal)}</td><td class="num" style="color:var(--purple)">${fmt(d.freeze)}</td><td class="action"><button class="link-btn" data-action="show-contribution" data-day="${d.day}">查看消费者贡献 →</button></td></tr>`).join(''):`<tr><td colspan="5" class="empty">该时间段无收益记录</td></tr>`}</tbody></table></div>${pager(rows.length)}</div><div class="note">解封后，该笔收益的原入账日“已确认”增加、“冻结”减少，“总钻石”保持不变。下一级消费者明细只对账本页的“冻结钻石”列。</div>`}
function renderRisks(){const f=state.filters;const rows=payers.filter(p=>(!f.uid||p.id.includes(f.uid))&&(!f.status||p.status===f.status)&&(!f.country||p.country.includes(f.country)));return title('风险充值用户','按最近 180 天官方与非官方净充值识别状态；仅作本需求的只读风险视图。')+`<div class="kpis">${kpi('异常用户',rows.filter(p=>p.status==='异常').length,'官方净充值达到门槛且补充不足','warning')}${kpi('当前正常',rows.filter(p=>p.status==='正常').length,'达到非官方充值 80% 比例')}${kpi('退款限制',rows.filter(p=>p.status==='退款限制').length,'需人工审核解除')}${kpi('记录总数',rows.length,'演示数据，不代表生产规模')}</div><div class="card"><div class="card-head"><h2>筛选风险用户</h2><span>金额为净充值美元；状态按已确认资金事件更新</span></div><div class="filters"><div class="field wide"><label>消费者 UID</label><input id="risk-uid" placeholder="输入消费者 UID" value="${esc(f.uid||'')}"></div><div class="field"><label>用户状态</label><select id="risk-status"><option value="">全部状态</option>${['异常','正常','退款限制'].map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field wide"><label>用户国家</label><select id="risk-country"><option value="">全部国家</option>${['加拿大','尼泊尔','印度','中国台湾'].map(c=>`<option ${f.country===c?'selected':''}>${c}</option>`).join('')}</select></div><button class="btn btn-primary" data-action="filter-risks">查询</button><button class="btn" data-action="reset-risks">重置</button></div></div><div class="card"><div class="card-head"><h2>用户资金风险状态</h2><span>第三方与币商合并计为非官方充值</span></div><div class="table-wrap"><table class="table"><thead><tr><th>消费者 UID / 昵称</th><th>国家</th><th>当前身份</th><th class="num">官方 O (USD)</th><th class="num">非官方 N (USD)</th><th class="num">补充比例</th><th>变化时间</th><th>识别原因</th></tr></thead><tbody>${rows.map(p=>`<tr><td><div class="name">${p.name}</div><div class="sub">UID ${p.id} · ${p.channel}</div></td><td>${p.country}</td><td>${statusPill(p.status)}</td><td class="num">$${fmt(p.o)}</td><td class="num">$${fmt(p.n)}</td><td class="num">${p.o?Math.round(p.n/p.o*100)+'%':'—'}</td><td>${p.time}</td><td>${p.reason}</td></tr>`).join('')||`<tr><td colspan="8" class="empty">未找到符合条件的用户</td></tr>`}</tbody></table></div>${pager(rows.length)}</div><div class="note warn">用户身份可随充值事件多次切换；每笔已正常入账或已解封的主播收益不会回冻。充值订单自然移出 180 天窗口不直接改变存量收益状态。</div>`}
function renderReviews(){const rows=reviews.filter(r=>state.reviewTab==='待审核'?r.status==='待审核':r.status!=='待审核');const pending=reviews.filter(r=>r.status==='待审核');return title('解封审核','充值达标与收益入账满 180 天只产生可解封资格；审核通过后才执行钻石转换。')+`<div class="kpis">${kpi('待审核申请',pending.length,'人工审核后才可执行','emphasis')}${kpi('待审钻石',fmt(pending.reduce((s,r)=>s+r.amount,0)),'仍在主播冻结余额中')}${kpi('到期送审',pending.filter(r=>r.reason==='收益到期').length,'逐笔入账满 180 天')}${kpi('退款风控',pending.filter(r=>r.hold).length,'需先核验退款限制','warning')}</div><div class="card"><div class="tabs"><button class="tab ${state.reviewTab==='待审核'?'active':''}" data-action="review-tab" data-tab="待审核">待审核 ${pending.length}</button><button class="tab ${state.reviewTab==='审核记录'?'active':''}" data-action="review-tab" data-tab="审核记录">审核记录</button></div><div class="card-head"><h2>${state.reviewTab==='待审核'?'待审解封申请':'历史审核记录'}</h2><span>一项申请可包含同一消费者的多笔收益，执行时逐笔再校验</span></div><div class="table-wrap"><table class="table"><thead><tr><th>申请编号 / 消费者</th><th>可解封原因</th><th>涉及范围</th><th class="num">申请钻石</th><th>申请时间</th><th>审核状态</th><th class="action">操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="name">${r.id}</div><div class="sub">消费者 UID ${r.payer} · ${payer(r.payer).name}</div></td><td>${pill(r.reason,r.reason==='退款风控'?'red':r.reason==='收益到期'?'orange':'purple')}</td><td>${r.anchors} 位主播 / ${r.records} 笔收益</td><td class="num">${fmt(r.amount)}</td><td>${r.created}</td><td>${r.status==='待审核'?pill('待审核','orange'):pill(r.status,'green')}</td><td class="action"><button class="link-btn" data-action="show-review" data-id="${r.id}">${r.status==='待审核'?'开始审核':'查看记录'} →</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">暂无此状态的审核记录</td></tr>`}</tbody></table></div>${pager(rows.length)}</div><div class="note">人工审核的批准范围固定到具体收益流水及钻石数。提交解封账务前会复核资格；批准后若来源用户再次异常，未到期且尚未执行的收益仍不能解封。</div>`}
function showContribution(day){const a=anchor(state.anchor),data=contributionFor(a.id,day);state.day=day;state.drawer='contribution';setURL();const listed=data.reduce((s,r)=>s+r.amount,0),daily=a.days.find(d=>d.day===day);$('#drawer-content').innerHTML=`<div class="drawer-head"><div><h2>消费者贡献明细</h2><p>主播 ${a.name} · UID ${a.id} · 收益入账日 ${day}</p></div><button class="close" data-action="close-drawer" aria-label="关闭">×</button></div><div class="drawer-body"><div class="detail-grid"><div class="detail-cell"><label>当日冻结钻石</label><strong>${fmt(daily?.freeze||0)}</strong></div><div class="detail-cell"><label>当前列出贡献</label><strong>${fmt(listed)}</strong></div><div class="detail-cell"><label>业务范围</label><strong style="font-size:13px">赠礼 · 房内游戏</strong></div></div><div class="filters" style="padding:0 0 16px"><div class="field wide"><label>消费者 UID</label><input id="contrib-uid" placeholder="输入消费者 UID"></div><div class="field"><label>入账日期</label><input type="date" value="${day}" disabled></div><button class="btn btn-primary" data-action="filter-contribution">搜索</button><button class="btn" data-action="reset-contribution">重置</button></div><div class="card" style="box-shadow:none"><div class="table-wrap"><table class="table tight"><thead><tr><th>消费者 UID / 昵称</th><th>业务类型</th><th>当前状态</th><th class="num">冻结钻石贡献</th><th>收益流水</th></tr></thead><tbody id="contrib-body">${contributionRows(data)}</tbody></table></div></div><div class="note">本层只列仍冻结的消费者贡献，合计对应上一级该日的“冻结钻石”。“可解封”只代表能提交人工审核，钻石在审核执行前仍被冻结。</div></div><div class="drawer-foot"><span class="minor">${data.length?'显示可追溯的示例流水':'该日未配置消费者示例明细'}</span><button class="btn" data-action="close-drawer">关闭</button></div>`;$('#overlay').classList.remove('hidden')}
function contributionRows(data){return data.map(r=>{const p=payer(r.payer);return `<tr><td><div class="name">${p.name}</div><div class="sub">UID ${p.id}</div></td><td>${r.type}</td><td>${r.eligible?pill('可解封','green'):pill('不可解封','gray')}<div class="sub">${r.why}</div></td><td class="num">${fmt(r.amount)}</td><td class="id">${r.txn}</td></tr>`}).join('')||`<tr><td colspan="5" class="empty">该日暂无消费者逐笔示例</td></tr>`}
function showReview(id){const r=reviews.find(x=>x.id===id);if(!r)return;state.review=id;state.drawer='review';setURL();const p=payer(r.payer),readonly=r.status!=='待审核';$('#drawer-content').innerHTML=`<div class="drawer-head"><div><h2>${readonly?'审核记录':'解封审核详情'}</h2><p>${r.id} · 消费者 ${p.name} / ${p.id}</p></div><button class="close" data-action="close-drawer" aria-label="关闭">×</button></div><div class="drawer-body"><div class="detail-grid"><div class="detail-cell"><label>申请解封钻石</label><strong>${fmt(r.amount)}</strong></div><div class="detail-cell"><label>可解封原因</label><strong style="font-size:15px">${r.reason}</strong></div><div class="detail-cell"><label>关联主播 / 收益</label><strong>${r.anchors} / ${r.records}</strong></div></div><div class="info-line"><span>消费者身份：<b>${p.status}</b></span><span>官方净充值：<b>$${fmt(p.o)}</b></span><span>非官方净充值：<b>$${fmt(p.n)}</b></span><span>审核状态：<b>${r.status}</b></span></div>${r.hold?`<div class="note warn"><b>退款风控限制：</b>审核时须核验退款订单与消费记录。通过操作将同时记录“解除限制”和“批准列出收益解封”；系统执行前仍会复核明细资格。</div>`:`<div class="note">${r.reason==='收益到期'?'这些收益按各自入账时间满 180 天送审；来源用户仍异常也可审核。':'来源用户非官方净充值达到官方金额的 80%，本申请覆盖其尚未解封的收益。'}</div>`}<h3 class="drawer-section">本次申请覆盖的收益流水</h3><div class="ledger">${r.txn.length?r.txn.map(t=>`<div class="ledger-item"><div><b>${t}</b><small>主播 ${t.includes('0320')?'35052361':t.includes('1003')?'39425722':t.includes('0926')?'37073632':'20101849'} · ${r.reason==='收益到期'?'入账 2026-03-20 · 到期 2026-09-16':'赠礼或房内游戏直接收益'}</small></div><strong>${fmt(r.amount)} ◆</strong></div>`).join(''):`<div class="ledger-item"><span>历史申请明细已归档</span><strong>${fmt(r.amount)} ◆</strong></div>`}</div><h3 class="drawer-section">审核与执行规则</h3><div class="timeline"><div class="timeline-item"><div><b>核验资格</b>仍冻结；用户正常或单笔入账满 180 天；不存在未处理退款限制。</div></div><div class="timeline-item"><div><b>人工结论</b>通过或驳回均保存审核人、时间、理由及本次明细快照。</div></div><div class="timeline-item"><div><b>账务执行</b>批准后逐笔复核，冻结余额转正常余额；已解封收益不回冻。</div></div></div>${readonly?`<div class="note">该申请已处理。原型仅展示记录，不执行真实账务。</div>`:`<div class="decision"><label for="review-comment">审核说明 <span style="color:var(--red)">*</span></label><textarea id="review-comment" placeholder="填写核验依据或驳回原因"></textarea></div>`}</div><div class="drawer-foot"><span class="minor">原型中的审核操作仅更新本地演示状态，不影响实际账户</span><div style="display:flex;gap:9px"><button class="btn" data-action="close-drawer">关闭</button>${readonly?'':`<button class="btn btn-danger" data-action="submit-review" data-decision="驳回">驳回</button><button class="btn btn-primary" data-action="submit-review" data-decision="通过">${r.hold?'解除限制并通过':'审核通过'}</button>`}</div></div>`;$('#overlay').classList.remove('hidden')}
function closeDrawer(update=true){$('#overlay').classList.add('hidden');state.drawer='';state.day='';state.review='';if(update)setURL()}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3300)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-nav],[data-action]');if(!el)return;if(el.dataset.nav){navigate(el.dataset.nav);return}const action=el.dataset.action;switch(action){case 'open-daily':navigate('daily',{anchor:el.dataset.id});break;case 'back-anchors':navigate('anchors');break;case 'show-contribution':showContribution(el.dataset.day);break;case 'show-review':showReview(el.dataset.id);break;case 'close-drawer':closeDrawer();break;case 'filter-anchors':state.filters={uid:$('#anchor-uid').value.trim(),from:$('#anchor-from').value,to:$('#anchor-to').value,country:$('#anchor-country').value};render();break;case 'reset-anchors':state.filters={};render();break;case 'filter-daily':state.filters={from:$('#daily-from').value,to:$('#daily-to').value};render();break;case 'reset-daily':state.filters={};render();break;case 'filter-risks':state.filters={uid:$('#risk-uid').value.trim(),status:$('#risk-status').value,country:$('#risk-country').value};render();break;case 'reset-risks':state.filters={};render();break;case 'review-tab':state.reviewTab=el.dataset.tab;render();break;case 'filter-contribution':{const uid=$('#contrib-uid').value.trim();const list=contributionFor(state.anchor,state.day).filter(r=>!uid||r.payer.includes(uid));$('#contrib-body').innerHTML=contributionRows(list);break}case 'reset-contribution':$('#contrib-uid').value='';$('#contrib-body').innerHTML=contributionRows(contributionFor(state.anchor,state.day));break;case 'submit-review':{const note=$('#review-comment').value.trim();if(!note){toast('请先填写审核说明');$('#review-comment').focus();return}const r=reviews.find(x=>x.id===state.review);if(!r)return;r.status=el.dataset.decision==='通过'?'已通过 · 待执行':'已驳回';r.audit=note;closeDrawer();render();toast(`申请 ${r.id} 已${el.dataset.decision}；演示数据未执行账务`);break}}});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeDrawer()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.drawer)closeDrawer()});render();
</script>
</body>
