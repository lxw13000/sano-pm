<div class="app">
  <aside class="sidebar">

<script>
const NOW='2026-10-10 14:00:00';
let OPERATOR='risk.admin';
const profiles={

 '39818897':{name:'Colin',country:'印度 (IN)'},'39912001':{name:'Ira',country:'中国台湾 (TW)'},
 '42001772':{name:'Mia',country:'印度 (IN)'},'43600219':{name:'Rafi',country:'印度 (IN)'},

};
const freezeUsers=[

 {userId:'20101849',createTime:'2026-09-12 12:07:00',delFlag:1,delTime:'2026-10-08 11:00:00',refund:0,refundUser:null,refundTime:null,autoDel:0},
 {userId:'39818897',createTime:'2026-09-25 09:35:00',delFlag:0,delTime:null,refund:0,refundUser:null,refundTime:null,autoDel:1},
 {userId:'39912001',createTime:'2026-03-20 11:25:00',delFlag:1,delTime:'2026-10-09 08:00:00',refund:0,refundUser:null,refundTime:null,autoDel:1},
 {userId:'42001772',createTime:'2026-10-03 14:06:00',delFlag:1,delTime:'2026-10-10 09:30:00',refund:0,refundUser:null,refundTime:null,autoDel:1},
 {userId:'43600219',createTime:'2026-09-26 18:26:00',delFlag:0,delTime:null,refund:0,refundUser:null,refundTime:null,autoDel:0},

];
const freezeRows=[

 {userId:'20101849',receiveUserId:'20101849',dayInt:20260925,anchorId:'20101849',type:1,diamond:1162,refund:0},

 {userId:'39912001',receiveUserId:'35052361',dayInt:20260320,anchorId:'35052361',type:1,diamond:560000,refund:0},
 {userId:'42001772',receiveUserId:'39425722',dayInt:20261003,anchorId:'39425722',type:2,diamond:124000,refund:0},
 {userId:'42001772',receiveUserId:'39425722',dayInt:20261004,anchorId:'39425722',type:1,diamond:35000,refund:0},
 {userId:'43600219',receiveUserId:'37073632',dayInt:20260926,anchorId:'37073632',type:1,diamond:1400129,refund:0},
 {userId:'20101849',receiveUserId:'25597644',dayInt:20260930,anchorId:'25597644',type:1,diamond:80000,refund:0},
 {userId:'38815421',receiveUserId:'35052361',dayInt:20260920,anchorId:'35052361',type:1,diamond:88200,refund:1,refundUser:'risk.admin',refundTime:'2026-10-09 16:20:00'}
];
// 示例中的汇总钻石按数据库原始精度保存；页面与核对计算统一除以 1000 后展示整数钻石。
freezeRows.forEach(row=>row.diamond*=1000);
const rechargeRows=[
 {userId:'20101849',status:2,producerType:0,money:40,createTime:'2026-09-14 10:00:00'},
 {userId:'20101849',status:2,producerType:4,money:50000,createTime:'2026-09-25 15:00:00'},
 {userId:'39912001',status:2,producerType:1,money:50,createTime:'2026-03-20 09:00:00'},
 {userId:'39912001',status:2,producerType:3,money:10,createTime:'2026-09-01 18:00:00'},
 {userId:'39912001',status:1,producerType:1,money:500,createTime:'2026-09-03 18:00:00'},
 {userId:'39912001',status:2,producerType:1,money:100,createTime:'2026-10-10 10:00:00'},
 {userId:'42001772',status:2,producerType:0,money:20,createTime:'2026-10-03 08:00:00'},
 {userId:'42001772',status:2,producerType:4,money:100000,createTime:'2026-10-04 12:00:00'}
];
const records=freezeRows.map((r,i)=>({id:92000001+i,userId:r.receiveUserId,consumeUserId:r.userId,anchorId:r.anchorId,commonId:58000001+i,createTime:dayText(r.dayInt)+' 18:2'+(i%10)+':00',tokens:r.diamond,tokensOld:0,tokensNew:r.diamond,businessType:r.type===1?101:401,freezeType:r.type,amount:1,propId:r.type===1?3201:null,roomId:70000+i}));
const state={view:new URLSearchParams(location.search).get('view')||'risk',receive:new URLSearchParams(location.search).get('receive')||'',day:Number(new URLSearchParams(location.search).get('day'))||0,drawer:'',modal:'',filters:{},selected:'',role:new URLSearchParams(location.search).get('role')||'admin'};
const ACCESS={admin:{risk:true,add:true,release:true,refund:true},entry:{risk:true,add:true,release:false,refund:false},release:{risk:true,add:false,release:true,refund:false},refund:{risk:false,add:false,release:false,refund:true}};
if(!ACCESS[state.role])state.role='admin';
function access(){return ACCESS[state.role]}
function syncOperator(){OPERATOR=state.role==='refund'?'refund.operator':state.role==='entry'?'risk.entry':state.role==='release'?'risk.release':'risk.admin'}
syncOperator();
const $=s=>document.querySelector(s),fmt=n=>Number(n||0).toLocaleString('en-US'),money=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),profile=id=>profiles[id]||{name:'用户 '+id,country:'—'},diamondUnit=n=>Math.trunc(Number(n||0)/1000),sum=rows=>diamondUnit(rows.reduce((a,r)=>a+r.diamond,0)),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function eligibleRefundRows(u){if(!u||!u.delTime)return [];const from=Number(u.createTime.slice(0,10).replaceAll('-','')),to=Number(u.delTime.slice(0,10).replaceAll('-',''));return freezeRows.filter(r=>r.userId===u.userId&&r.type!==0&&r.refund===0&&r.dayInt>=from&&r.dayInt<=to)}
function assess(u){
  const from=u.createTime.slice(0,10),to=u.delTime.slice(0,10);
  const payments=rechargeRows.filter(r=>r.userId===u.userId&&r.status===2&&r.createTime.slice(0,10)>=from&&r.createTime.slice(0,10)<=to);
  const official=payments.filter(r=>r.producerType===0||r.producerType===1).reduce((total,r)=>total+r.money,0);
  const third=payments.filter(r=>r.producerType!==0&&r.producerType!==1).reduce((total,r)=>total+(r.producerType===4?r.money/10000:r.money),0);
  const value=Math.trunc((official+third)*10000*0.84);
  const diamonds=sum(eligibleRefundRows(u));
  return {from,to,official,third,value,diamonds,shortfall:value<diamonds};
}
function assessmentMessage(a){return a.shortfall?'该用户充值金额价值小于待解封钻石，请谨慎操作，建议核实充值后再解封。':'充值金额价值不小于待解封钻石，可继续核对并一次性解封。'}
function assessmentBadge(a){return pill(a.shortfall?'充值价值不足':'充值价值覆盖',a.shortfall?'red':'green')}
function dayText(n){let s=String(n);return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8)}
function stamp(s){return new Date(s.replace(' ','T')+'+08:00').getTime()}
function readyAt(u){return new Date(stamp(u.delTime)+86400000).toLocaleString('sv-SE',{timeZone:'Asia/Shanghai'}).replace('T',' ')}
function canRefund(u){return u.delFlag===1&&u.refund===0&&stamp(NOW)>=stamp(u.delTime)+86400000}
function riskStatus(u){return u.delFlag===0?'封禁中':u.refund===1?'已退款':!canRefund(u)?'等待 24 小时':eligibleRefundRows(u).length?'待退款':'待核对记录'}
function pill(text,kind){return `<span class="pill ${kind}">${text}</span>`}
function statusPill(u){let s=riskStatus(u);return pill(s,s==='封禁中'?'red':s==='已退款'?'green':s==='待退款'?'orange':'gray')}
function rowStatus(r){return pill(r.refund?'已解除':'未解除',r.refund?'green':'orange')}
function key(r){return [r.userId,r.receiveUserId,r.dayInt,r.anchorId,r.type].join('|')}
function setURL(){let q=new URLSearchParams();q.set('view',state.view);q.set('role',state.role);if(state.receive)q.set('receive',state.receive);if(state.day)q.set('day',state.day);history.replaceState(null,'','?'+q)}
function nav(view,opts={}){state.view=view;state.receive=opts.receive||'';state.day=opts.day||0;state.filters={};state.drawer='';state.modal='';setURL();render();scrollTo(0,0)}
function heading(h,p,right=''){return `<div class="heading"><div><h1>${h}</h1><p>${p}</p></div>${right}</div>`}
function kpi(label,value,desc,color=''){return `<div class="kpi"><label>${label}</label><strong class="${color}">${value}</strong><small>${desc}</small></div>`}
function foot(n){return `<div class="foot"><span>共 ${n} 条演示记录 · 每页 20 条</span><span class="page-chip">1</span></div>`}
function empty(cols,text='没有符合条件的记录'){return `<tr><td colspan="${cols}" class="empty">${text}</td></tr>`}
function render(){
  const rights=access();
  if(state.view==='risk'&&!rights.risk){state.view='refund';state.receive='';state.day=0}
  if(state.view==='refund'&&!rights.refund){state.view='risk'}
  document.querySelector('[data-nav="risk"]').style.display=rights.risk?'':'none';

  // 原型中的一次操作模拟服务端事务：同批记录使用同一操作人和时间。
  rows.forEach(r=>{r.refund=1;r.refundUser=OPERATOR;r.refundTime=NOW});
  const remaining=freezeRows.some(r=>r.userId===u.userId&&!r.refund);
  if(!remaining){u.refund=1;u.refundUser=OPERATOR;u.refundTime=NOW}
  hideDrawer();render();toast(remaining?`已一次性解封 ${rows.length} 条；仍有不在本次范围内的冻结记录`:`已一次性解封 ${rows.length} 条，用户退款完成`);
}
function openModal(kind,id=''){
  if((kind==='add'&&!access().add)||(kind==='release'&&!access().release)){toast('当前角色无此操作权限');return}
  state.modal=kind;state.selected=id;
  const u=freezeUsers.find(x=>x.userId===id);
  const content=kind==='add'
    ?`<h2>手动加入风险充值用户</h2><p>新增 sano_wallet_freeze_user 记录；用户 ID 不可重复。</p><div class="form-field"><label>用户 UID *</label><input id="new-uid" inputmode="numeric" placeholder="输入用户 UID"></div><div class="form-field"><label>是否允许自动解除</label><select id="new-auto"><option value="0">否，仅人工解除</option><option value="1">是，允许自动解除</option></select></div>`
    :`<h2>人工解除封禁</h2><p>用户 ${u.userId} · ${profile(u.userId).name}。操作后记录 del_flag = 1，del_time = ${NOW}。</p><div class="form-field"><label>操作说明 *</label><textarea id="release-note" placeholder="填写解除封禁依据"></textarea></div>`;
  $('#modal').innerHTML=content+`<div class="modal-actions"><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="confirm-modal">${kind==='add'?'确认加入':'确认解除'}</button></div>`;
  $('#modal-overlay').classList.remove('hidden');
}
function closeModal(){$('#modal-overlay').classList.add('hidden');state.modal='';state.selected=''}
function toast(s){let e=$('#toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3400)}
function confirmModal(){
  const kind=state.modal;
  if((kind==='add'&&!access().add)||(kind==='release'&&!access().release)){toast('当前角色无此操作权限');return}
  if(kind==='add'){
    const uid=$('#new-uid').value.trim();
    if(!/^\d+$/.test(uid)||Number(uid)>2147483647){toast('请输入有效的整数用户 UID');return}
    if(freezeUsers.some(u=>u.userId===uid)){toast('该用户已在风险充值用户列表中');return}
    freezeUsers.unshift({userId:uid,createTime:NOW,delFlag:0,delTime:null,refund:0,refundUser:null,refundTime:null,autoDel:Number($('#new-auto').value)});
    closeModal();render();toast('已加入演示数据');
  }else if(kind==='release'){
    const note=$('#release-note').value.trim();if(!note){toast('请填写操作说明');return}
    const u=freezeUsers.find(x=>x.userId===state.selected);
    if(!u||u.delFlag){toast('该用户已解除');return}
    u.delFlag=1;u.delTime=NOW;u.releaseNote=note;
    closeModal();render();toast('已人工解除封禁');
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-nav],[data-action]');if(!el)return;
  if(el.dataset.nav){nav(el.dataset.nav);return}
  const a=el.dataset.action;
  switch(a){
    case 'filter-risk':state.filters={uid:$('#risk-uid').value.trim(),from:$('#risk-from').value,to:$('#risk-to').value,state:$('#risk-state').value,auto:$('#risk-auto').value};render();break;
    case 'reset-risk':state.filters={};render();break;
    case 'add-risk':openModal('add');break;
    case 'manual-release':openModal('release',el.dataset.id);break;
    case 'filter-freeze':state.filters={receive:$('#freeze-receive').value.trim(),from:$('#freeze-from').value,to:$('#freeze-to').value,country:$('#freeze-country').value};render();break;
    case 'reset-freeze':state.filters={};render();break;
    case 'open-days':nav('freeze',{receive:el.dataset.id});break;
    case 'back-freeze':nav('freeze');break;
    case 'filter-days':state.filters={from:$('#days-from').value,to:$('#days-to').value};render();break;
    case 'reset-days':state.filters={};render();break;
    case 'open-contribution':openContribution(el.dataset.day);break;
    case 'filter-consumer':state.filters.consumers=$('#consumer-uid').value.trim();openContribution(state.day);break;
    case 'reset-consumer':state.filters.consumers='';openContribution(state.day);break;
    case 'record-detail':openRecord(el.dataset.key);break;
    case 'back-contribution':openContribution(state.day);break;
    case 'close-drawer':hideDrawer();break;
    case 'filter-refund':state.filters={uid:$('#refund-uid').value.trim(),state:$('#refund-state').value};render();break;
    case 'reset-refund':state.filters={};render();break;
    case 'open-refund':openRefundDrawer(el.dataset.id);break;
    case 'refund-all':refundAll();break;
    case 'close-modal':closeModal();break;
    case 'confirm-modal':confirmModal();break;
  }
});
document.addEventListener('change',e=>{if(e.target.id==='role-select'){state.role=e.target.value;syncOperator();state.view=access().risk?'risk':'refund';state.receive='';state.day=0;state.filters={};setURL();render()}});$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')hideDrawer()});$('#modal-overlay').addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal)closeModal();else if(state.drawer)hideDrawer()}});render();
</script>
</body>
</html>
