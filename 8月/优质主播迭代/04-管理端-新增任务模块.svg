<text x="324" y="226" font-size="14" fill="#334155" font-weight="600" text-anchor="start">*  模块图标</text>
<rect x="520" y="190" width="126" height="126" rx="8" fill="#FAFBFD" stroke="#CBD5E1" stroke-width="1"/>
