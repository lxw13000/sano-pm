<text x="78" y="150" font-size="15" fill="#E2E8F0" font-weight="500" text-anchor="start">主播身份</text>
<rect x="26" y="172" width="206" height="46" rx="7" fill="#5632EE" stroke="none" stroke-width="1"/>
<circle cx="58" cy="195" r="4" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="78" y="202" font-size="15" fill="#FFFFFF" font-weight="500" text-anchor="start">任务库</text>
<text x="30" y="286" font-size="18" fill="#FFFFFF" font-weight="400" text-anchor="start">□</text>
<text x="64" y="286" font-size="15" fill="#FFFFFF" font-weight="500" text-anchor="start">主播身份成员</text>
<text x="30" y="350" font-size="18" fill="#FFFFFF" font-weight="400" text-anchor="start">□</text>
<text x="64" y="350" font-size="15" fill="#FFFFFF" font-weight="500" text-anchor="start">周任务审核</text>
<text x="30" y="414" font-size="18" fill="#FFFFFF" font-weight="400" text-anchor="start">□</text>
<text x="64" y="414" font-size="15" fill="#FFFFFF" font-weight="500" text-anchor="start">奖励领取记录</text>
<text x="290" y="64" font-size="31" fill="#111827" font-weight="700" text-anchor="start">任务库 / 新增任务模块</text>
<text x="292" y="98" font-size="14" fill="#64748B" font-weight="400" text-anchor="start">创建公共任务模块，保存后可关联具体任务项</text>
<rect x="1420" y="42" width="88" height="42" rx="7" fill="#FFFFFF" stroke="#B8A9FF" stroke-width="1"/>
<text x="1464" y="69" font-size="14" fill="#4F2BEE" font-weight="500" text-anchor="middle">取消</text>
<rect x="1524" y="42" width="98" height="42" rx="7" fill="#4F2BEE" stroke="#4F2BEE" stroke-width="1"/>
<text x="1573" y="69" font-size="14" fill="#FFFFFF" font-weight="500" text-anchor="middle">保存</text>
<rect x="290" y="142" width="1330" height="650" rx="10" fill="#FFFFFF" stroke="#E3E8F1" stroke-width="1"/>
