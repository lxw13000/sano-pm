<text x="534" y="379" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="start">请输入模块名称</text>
<text x="520" y="444" font-size="13" fill="#334155" font-weight="500" text-anchor="start">*  模块奖金</text>
<rect x="520" y="456" width="1030" height="42" rx="6" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="1"/>
<text x="534" y="483" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="start">$  请输入奖励金额</text>
<text x="324" y="580" font-size="14" fill="#334155" font-weight="600" text-anchor="start">是否启用</text>
<rect x="520" y="554" width="62" height="28" rx="14" fill="#4F2BEE" stroke="none" stroke-width="1"/>
<text x="551" y="573" font-size="12" fill="#FFFFFF" font-weight="500" text-anchor="middle">启用</text>
<rect x="610" y="554" width="62" height="28" rx="14" fill="#F1F5F9" stroke="none" stroke-width="1"/>
<text x="641" y="573" font-size="12" fill="#64748B" font-weight="500" text-anchor="middle">停用</text>
<text x="324" y="652" font-size="14" fill="#334155" font-weight="600" text-anchor="start">备注</text>
<rect x="520" y="620" width="1030" height="112" rx="7" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="1"/>
<text x="540" y="650" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="start">请输入备注，最多200字</text>
<text x="1518" y="712" font-size="11" fill="#94A3B8" font-weight="400" text-anchor="end">0/200</text>
<rect x="290" y="814" width="1330" height="58" rx="7" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
<text x="314" y="850" font-size="13" fill="#475569" font-weight="400" text-anchor="start">ⓘ 保存模块后，可在任务模块详情中从任务项列表关联任务项。</text>
</svg>
