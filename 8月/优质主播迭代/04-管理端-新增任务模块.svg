<text x="676" y="280" font-size="12" fill="#64748B" font-weight="400" text-anchor="start">建议PNG，1:1，≤2MB</text>
<text x="520" y="340" font-size="13" fill="#334155" font-weight="500" text-anchor="start">*  模块名称</text>
