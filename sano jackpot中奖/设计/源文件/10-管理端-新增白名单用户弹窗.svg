  <rect x="278" y="234" width="1344" height="52" rx="4" fill="#E6F7FF" stroke="#91D5FF"/><circle cx="302" cy="260" r="9" fill="#1890FF"/><text x="302" y="264" font-size="12" text-anchor="middle" fill="#FFFFFF">i</text><text x="324" y="257" font-size="13" fill="#35556F">当前有效名单 2 人；白名单仍计算实际价值V并匹配区间中奖比例，跳过倍率M与随机判断，中奖率按100%。</text><text x="324" y="276" class="help">其他请求先锁定中奖时，本次开奖结束；未使用的白名单权益继续等待后续消费请求。</text>
