  <rect x="278" y="650" width="1344" height="82" rx="4" fill="#FFFBE6" stroke="#FFE58F"/><text x="302" y="678" font-size="13" fill="#8C6D1F">有效名单规则</text><text x="302" y="702" class="help">单次消费通过随机阈值判定后，白名单用户按100%中奖率尝试锁定；多人按服务端请求顺序先到先得。结算成功后自动移出。</text><text x="302" y="720" class="help">人工移除必须填写原因并写入名单记录；正在结算或已锁定中奖的权益不可人工移除。</text>
