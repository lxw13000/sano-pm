    .nav{font-size:14px;font-weight:400;fill:#A8B4C5}
    .nav-active{font-size:14px;font-weight:500;fill:#FFFFFF}
    .th{font-size:13px;font-weight:600;fill:#4B5563}
    .td{font-size:13px;font-weight:400;fill:#4B5563}
    .link{font-size:13px;font-weight:400;fill:#1890FF}
    .btn{font-size:13px;font-weight:400}
  </style>

  <rect width="1672" height="941" fill="#F5F7FA"/>
  <rect x="0" y="0" width="228" height="941" fill="#001529"/>
  <rect x="228" y="0" width="1444" height="60" fill="#FFFFFF"/>
  <line x1="228" y1="60" x2="1672" y2="60" stroke="#E8E8E8"/>

  <text x="24" y="39" font-size="20" font-weight="600" fill="#FFFFFF">SANO 管理后台</text>
  <rect x="0" y="70" width="228" height="50" fill="#072746"/>
  <text x="24" y="102" class="nav-active">◇  Jackpot管理</text>
  <text x="198" y="102" class="nav-active">⌃</text>
  <rect x="0" y="120" width="228" height="48" fill="#001D33"/>
  <rect x="0" y="120" width="3" height="48" fill="#1890FF"/>
  <text x="42" y="150" font-size="14" fill="#1890FF" font-weight="500">Jackpot配置</text>
  <text x="42" y="202" class="nav">Jackpot记录</text>
  <text x="42" y="254" class="nav">Jackpot计入记录</text>

  <text x="258" y="37" font-size="13" fill="#8C8C8C">首页</text>
  <text x="300" y="37" font-size="13" fill="#BFBFBF">/</text>
  <text x="318" y="37" font-size="13" fill="#262626">Jackpot配置</text>
  <circle cx="1616" cy="30" r="16" fill="#FAFAFA" stroke="#E5E7EB"/>
  <text x="1616" y="35" font-size="15" text-anchor="middle" fill="#64748B">管</text>

  <text x="254" y="105" class="title">Jackpot配置</text>
  <text x="254" y="132" class="sub">管理不同Jackpot类型的基础规则，并进入明细配置维护随机阈值和消费价值模板</text>

  <rect x="254" y="158" width="90" height="36" rx="4" fill="#FFFFFF" stroke="#91CAFF"/>
  <text x="299" y="181" class="btn" text-anchor="middle" fill="#1890FF">＋ 新增</text>
  <rect x="356" y="158" width="90" height="36" rx="4" fill="#FFFBE6" stroke="#FFD666"/>
  <text x="401" y="181" class="btn" text-anchor="middle" fill="#D48806">⇩ 导出</text>
  <circle cx="1578" cy="176" r="17" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="1578" y="181" font-size="15" text-anchor="middle" fill="#64748B">⌕</text>
  <circle cx="1622" cy="176" r="17" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="1622" y="181" font-size="15" text-anchor="middle" fill="#64748B">↻</text>

  <rect x="254" y="212" width="1392" height="284" rx="3" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="254" y="212" width="1392" height="54" fill="#FAFAFA"/>
  <line x1="254" y1="266" x2="1646" y2="266" stroke="#E8E8E8"/>
  <rect x="278" y="231" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="326" y="245" class="th">Jackpot类型</text>
  <text x="484" y="245" class="th">累计最大值</text>
  <text x="610" y="245" class="th">模板数量</text>
  <text x="716" y="245" class="th">抽水比例</text>
  <text x="818" y="245" class="th">发放次数</text>
  <text x="930" y="245" class="th">条件7日流水</text>
  <text x="1068" y="245" class="th">基础发放概率</text>
  <text x="1245" y="245" class="th">排序</text>
  <text x="1320" y="245" class="th">备注</text>
  <text x="1424" y="245" class="th">操作</text>

  <rect x="278" y="286" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="326" y="300" class="td">幸运礼物</text>
  <text x="484" y="300" class="td">2,864,279</text>
  <text x="610" y="300" class="td">3套</text>
  <text x="716" y="300" class="td">0.005%</text>
  <text x="818" y="300" class="td">1</text>
  <text x="930" y="300" class="td">100,000</text>
  <text x="1068" y="300" class="td">1</text>
  <text x="1084" y="300" font-size="12" fill="#FF7875">（十万分比：0.00001）</text>
  <text x="1245" y="300" class="td">0</text>
  <text x="1320" y="300" class="td">—</text>
  <text x="1460" y="300" font-size="12" fill="#1890FF">修改</text>
  <line x1="1492" y1="287" x2="1492" y2="303" stroke="#D9D9D9"/>
  <text x="1502" y="300" font-size="12" fill="#1890FF">明细配置</text>
  <line x1="1562" y1="287" x2="1562" y2="303" stroke="#D9D9D9"/>
  <text x="1572" y="300" font-size="12" fill="#1890FF" font-weight="500">白名单</text>
  <line x1="254" y1="326" x2="1646" y2="326" stroke="#E8E8E8"/>

  <rect x="278" y="347" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="326" y="361" class="td">游戏</text>
  <text x="484" y="361" class="td">3,264,587</text>
  <text x="610" y="361" class="td">3套</text>
  <text x="716" y="361" class="td">0.005%</text>
  <text x="818" y="361" class="td">1</text>
  <text x="930" y="361" class="td">100,000</text>
  <text x="1068" y="361" class="td">1</text>
  <text x="1084" y="361" font-size="12" fill="#FF7875">（十万分比：0.00001）</text>
  <text x="1245" y="361" class="td">0</text>
  <text x="1320" y="361" class="td">—</text>
  <text x="1460" y="361" font-size="12" fill="#1890FF">修改</text>
  <line x1="1492" y1="348" x2="1492" y2="364" stroke="#D9D9D9"/>
  <text x="1502" y="361" font-size="12" fill="#1890FF">明细配置</text>
  <line x1="1562" y1="348" x2="1562" y2="364" stroke="#D9D9D9"/>
  <text x="1572" y="361" font-size="12" fill="#1890FF" font-weight="500">白名单</text>
  <line x1="254" y1="387" x2="1646" y2="387" stroke="#E8E8E8"/>

  <rect x="254" y="387" width="1392" height="109" fill="#FFFFFF"/>
  <text x="1405" y="456" font-size="13" fill="#595959">共 2 条</text>
  <rect x="1471" y="434" width="82" height="34" rx="4" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="1512" y="456" font-size="13" text-anchor="middle" fill="#595959">10条/页⌄</text>
  <rect x="1565" y="434" width="34" height="34" rx="4" fill="#1890FF"/>
  <text x="1582" y="456" font-size="13" text-anchor="middle" fill="#FFFFFF">1</text>
  <rect x="1611" y="434" width="34" height="34" rx="4" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="1628" y="456" font-size="16" text-anchor="middle" fill="#BFBFBF">›</text>

  <rect x="254" y="520" width="1392" height="58" rx="4" fill="#E6F7FF" stroke="#91D5FF"/>
  <circle cx="282" cy="549" r="9" fill="#1890FF"/>
  <text x="282" y="553" font-size="12" text-anchor="middle" fill="#FFFFFF">i</text>
  <text x="304" y="545" font-size="13" fill="#35556F">“修改”维护基础字段；“明细配置”维护请求级随机阈值、消费模板及区间参数；“白名单”管理一次性优先中奖权益。</text>
  <text x="304" y="566" font-size="12" fill="#69869C">每一行Jackpot类型拥有独立配置；保存后的配置从后续成功消费请求开始使用，不预先锁定开奖参数。</text>
</svg>
