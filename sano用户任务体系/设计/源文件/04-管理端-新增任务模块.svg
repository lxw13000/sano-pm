<rect x="1230" y="564" width="320" height="42" rx="6" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="1"/>
<text x="1244" y="591" font-size="13" fill="#1E293B" font-weight="400" text-anchor="start">有效邀请人数（人）  ⌄</text>
<text x="520" y="628" font-size="11" fill="#64748B" font-weight="400" text-anchor="start">指标名称、类型和单位来自任务结果定义；运营不能手工输入JSON字段路径。</text>
<text x="520" y="674" font-size="15" fill="#111827" font-weight="600" text-anchor="start">奖励档位</text>
