<text x="1125" y="389" font-size="14" fill="#4F2BEE" font-weight="500" text-anchor="middle">＋ 添加任务项</text>
<text x="1236" y="378" font-size="11" fill="#64748B" font-weight="400" text-anchor="start">任务项可复用，不配置奖金</text>
<text x="324" y="458" font-size="16" fill="#111827" font-weight="600" text-anchor="start">2  模块角色、完成与资格策略</text>
