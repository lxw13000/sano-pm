<text x="742" y="773" font-size="12" fill="#334155" font-weight="400" text-anchor="start">人</text>
<text x="862" y="773" font-size="12" fill="#334155" font-weight="400" text-anchor="start">$5</text>
<text x="1072" y="773" font-size="12" fill="#334155" font-weight="400" text-anchor="start">删除</text>
<rect x="520" y="782" width="680" height="42" rx="0" fill="#FFFFFF" stroke="#E9EDF3" stroke-width="1"/>
<text x="532" y="815" font-size="12" fill="#334155" font-weight="400" text-anchor="start">≥ 5</text>
<text x="742" y="815" font-size="12" fill="#334155" font-weight="400" text-anchor="start">人</text>
<text x="862" y="815" font-size="12" fill="#334155" font-weight="400" text-anchor="start">$10</text>
<text x="1072" y="815" font-size="12" fill="#334155" font-weight="400" text-anchor="start">删除</text>
<rect x="520" y="824" width="680" height="42" rx="0" fill="#FFFFFF" stroke="#E9EDF3" stroke-width="1"/>
<text x="532" y="857" font-size="12" fill="#334155" font-weight="400" text-anchor="start">≥ 10</text>
<text x="742" y="857" font-size="12" fill="#334155" font-weight="400" text-anchor="start">人</text>
<text x="862" y="857" font-size="12" fill="#334155" font-weight="400" text-anchor="start">$20</text>
<text x="1072" y="857" font-size="12" fill="#334155" font-weight="400" text-anchor="start">删除</text>
<text x="1230" y="674" font-size="13" fill="#334155" font-weight="600" text-anchor="start">策略JSON（系统生成，只读）</text>
<rect x="1230" y="696" width="320" height="166" rx="7" fill="#111827" stroke="none" stroke-width="1"/>
<text x="1248" y="724" font-size="11" fill="#C4B5FD" font-weight="500" text-anchor="start">TIER_BY_TASK_METRIC</text>
<text x="1248" y="750" font-size="10" fill="#E2E8F0" font-weight="400" text-anchor="start">source: EFFECTIVE_INVITE</text>
<text x="1248" y="774" font-size="10" fill="#A7F3D0" font-weight="400" text-anchor="start">metric: effectiveInviteCount</text>
<text x="1248" y="810" font-size="10" fill="#94A3B8" font-weight="400" text-anchor="start">取最高已达档，不累加</text>
<text x="1248" y="836" font-size="10" fill="#94A3B8" font-weight="400" text-anchor="start">保存后冻结到周任务快照</text>
