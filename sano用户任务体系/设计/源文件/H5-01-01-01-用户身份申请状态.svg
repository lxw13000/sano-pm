<text x="90" y="372" font-size="20" fill="#111827" font-weight="700" text-anchor="start">生效规则</text>
<text x="90" y="414" font-size="15" fill="#475569" font-weight="400" text-anchor="start">• 审核通过时明确身份生效起始周期。</text>
<text x="90" y="450" font-size="15" fill="#475569" font-weight="400" text-anchor="start">• 不生成不完整周期任务。</text>
<text x="90" y="486" font-size="15" fill="#475569" font-weight="400" text-anchor="start">• 失效后7天可重提；禁止后不可再申请。</text>
<text x="90" y="522" font-size="15" fill="#475569" font-weight="400" text-anchor="start">• 生效后可查看日、周、月三类任务模块。</text>
