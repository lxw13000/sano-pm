<text x="88" y="2310" font-size="13" fill="#475569" font-weight="400" text-anchor="start">一个被邀请用户只归属一个邀请人；本周未达标不顺延。</text>
<text x="88" y="2352" font-size="13" fill="#475569" font-weight="400" text-anchor="start">1人奖10,000钻石 · 3人奖30,000钻石 · 5人奖50,000钻石。</text>
<text x="88" y="2394" font-size="13" fill="#475569" font-weight="400" text-anchor="start">阶梯奖励取最高已达档，不累计低档奖励。</text>
<text x="88" y="2436" font-size="12" fill="#64748B" font-weight="400" text-anchor="start">消费按实际金币流水累计，不扣退款、撤销或异常后续处理。</text>
