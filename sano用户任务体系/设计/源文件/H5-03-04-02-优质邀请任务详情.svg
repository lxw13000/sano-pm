<text x="88" y="2396" font-size="13" fill="#475569" font-weight="400" text-anchor="start">每个直播达标日的直播时长至少2小时，两项须同时满足。</text>
<text x="88" y="2438" font-size="13" fill="#475569" font-weight="400" text-anchor="start">消费者路径：本周实际消费金币累计≥1,000,000金币。</text>
<text x="88" y="2480" font-size="13" fill="#475569" font-weight="400" text-anchor="start">主播或消费者任一路径达标，即为有效优质邀请。</text>
<text x="88" y="2522" font-size="13" fill="#475569" font-weight="400" text-anchor="start">仅统计本周新邀请及邀请关系生效后的行为，截止周日23:59。</text>
<text x="88" y="2564" font-size="13" fill="#475569" font-weight="400" text-anchor="start">一个用户只归属一个邀请人；双路径达标仍只计1人。</text>
<text x="88" y="2606" font-size="13" fill="#475569" font-weight="400" text-anchor="start">本周未达标不顺延到以后周期；历史邀请不参与统计。</text>
<text x="88" y="2648" font-size="12" fill="#64748B" font-weight="400" text-anchor="start">消费按实际金币流水累计，不扣退款、撤销或异常后续处理。</text>
