<text x="52" y="410" font-size="14" fill="#FFF" font-weight="500" text-anchor="start">周期任务审核</text>
<text x="52" y="474" font-size="14" fill="#FFF" font-weight="500" text-anchor="start">周期奖励结算记录</text>
<text x="290" y="64" font-size="31" fill="#111827" font-weight="700" text-anchor="start">用户身份 / 黄金优质主播 / App规则说明</text>
<text x="292" y="98" font-size="14" fill="#64748B" font-weight="400" text-anchor="start">维护用户可见的身份、任务、结算与领奖规则</text>
<rect x="1450" y="42" width="160" height="42" rx="7" fill="#4F2BEE" stroke="#B8A9FF" stroke-width="1"/>
<text x="1530" y="69" font-size="14" fill="#FFFFFF" font-weight="500" text-anchor="middle">保存规则</text>
<rect x="280" y="126" width="500" height="758" rx="10" fill="#FFFFFF" stroke="#E3E8F1" stroke-width="1"/>
<text x="300" y="160" font-size="17" fill="#111827" font-weight="600" text-anchor="start">规则章节</text>
<text x="300" y="184" font-size="12" fill="#64748B" font-weight="400" text-anchor="start">拖拽调整App展示顺序</text>
<rect x="304" y="196" width="452" height="70" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="326" y="238" font-size="14" fill="#334155" font-weight="600" text-anchor="start">≡  身份资格</text>
<rect x="304" y="288" width="452" height="70" rx="8" fill="#F3EFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="326" y="330" font-size="14" fill="#4F2BEE" font-weight="600" text-anchor="start">≡  任务周期与完成方式</text>
<rect x="304" y="380" width="452" height="70" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="326" y="422" font-size="14" fill="#334155" font-weight="600" text-anchor="start">≡  模块奖励策略</text>
<rect x="304" y="472" width="452" height="70" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="326" y="514" font-size="14" fill="#334155" font-weight="600" text-anchor="start">≡  周期审核与结算</text>
<rect x="304" y="564" width="452" height="70" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="326" y="606" font-size="14" fill="#334155" font-weight="600" text-anchor="start">≡  主动领取奖励</text>
<rect x="304" y="656" width="452" height="70" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="326" y="698" font-size="14" fill="#334155" font-weight="600" text-anchor="start">≡  升级、降级与失效</text>
<rect x="806" y="126" width="834" height="758" rx="10" fill="#FFFFFF" stroke="#E3E8F1" stroke-width="1"/>
<text x="826" y="160" font-size="17" fill="#111827" font-weight="600" text-anchor="start">规则内容编辑与预览</text>
<text x="834" y="196" font-size="13" fill="#334155" font-weight="500" text-anchor="start">章节标题</text>
<rect x="834" y="208" width="760" height="42" rx="6" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="1"/>
<text x="848" y="235" font-size="13" fill="#1E293B" font-weight="400" text-anchor="start">任务周期与完成方式</text>
<rect x="834" y="270" width="760" height="252" rx="7" fill="#FFF" stroke="#DCE3EE" stroke-width="1"/>
<text x="854" y="310" font-size="14" fill="#334155" font-weight="400" text-anchor="start">1. 每个任务模块有日、周或月周期。</text>
<text x="854" y="350" font-size="14" fill="#334155" font-weight="400" text-anchor="start">2. 模块内全部任务要求完成后，模块才完成并获得奖励。</text>
<text x="854" y="390" font-size="14" fill="#334155" font-weight="400" text-anchor="start">3. 小周期任务按至少完成次数、最长连续次数统计。</text>
<text x="854" y="430" font-size="14" fill="#334155" font-weight="400" text-anchor="start">4. 阶梯模块达到最低档即完成，奖励按最高档发放。</text>
<text x="854" y="470" font-size="14" fill="#334155" font-weight="400" text-anchor="start">5. 周期审核后生成结算记录，达标奖励进入待领取。</text>
<rect x="834" y="560" width="760" height="190" rx="14" fill="#F7F4FF" stroke="none" stroke-width="1"/>
<text x="1214" y="598" font-size="14" fill="#4F2BEE" font-weight="600" text-anchor="middle">App预览</text>
<text x="870" y="642" font-size="17" fill="#111827" font-weight="700" text-anchor="start">任务周期与完成方式</text>
<text x="870" y="680" font-size="13" fill="#475569" font-weight="400" text-anchor="start">完成模块内全部任务要求，即可获得该模块对应奖励。</text>
<text x="870" y="714" font-size="13" fill="#475569" font-weight="400" text-anchor="start">详情展示完成次数、最长连续次数和当前奖励档位。</text>
</svg>
